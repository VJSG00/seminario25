<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simprod</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
  <style>
    .lab-checklist {
      background: #f1f1f1;
      padding: 10px;
      border-radius: 5px;
      max-width: 200px;
    }
    /* Reducir el espacio vertical del gráfico */
    .graph-container {
      max-width: 800px;
      max-height: 400px; /* altura reducida */
      overflow: auto;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1 class="mb-4">Simprod</h1>

  <form method="post" action="{% url 'rendimiento_resultado' %}">
    {% csrf_token %}
    <!-- Campo oculto para la cache_key -->
    <input type="hidden" name="cache_key" value="{{ cache_key }}">

    <!-- Acordeón -->
    <div class="accordion" id="datosAccordion">
      <!-- Sección de Datos Experimentales -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingExperimental">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                  data-bs-target="#collapseExperimental" aria-expanded="false"
                  aria-controls="collapseExperimental">
            Datos Experimentales
          </button>
        </h2>
        <div id="collapseExperimental" class="accordion-collapse collapse"
             aria-labelledby="headingExperimental" data-bs-parent="#datosAccordion">
          <div class="accordion-body d-flex flex-wrap">

            <!-- Gráfico experimental con tamaño ajustado -->
            <div class="graph-container">
              {{ experimental_plot | safe }}
            </div>

            <!-- Checkboxes de autores experimentales -->
            <div class="lab-checklist">
              <h5>Autores</h5>
              {% for author in experimental_author %}
                <div class="form-check">
                  <!-- Se utiliza forloop.counter0 para que el valor sea el índice -->
                  <input class="form-check-input" type="checkbox" name="selected_experimentals" id="exp_{{ forloop.counter0 }}" value="{{ forloop.counter0 }}">
                  <label class="form-check-label" for="exp_{{ forloop.counter0 }}">
                    {{ author }}
                  </label>
                </div>
              {% endfor %}
            </div>

          </div>
        </div>
      </div>

      <!-- Sección de Datos Evaluados -->
      <div class="accordion-item">
        <h2 class="accordion-header" id="headingEvaluated">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                  data-bs-target="#collapseEvaluated" aria-expanded="false"
                  aria-controls="collapseEvaluated">
            Datos Evaluados
          </button>
        </h2>
        <div id="collapseEvaluated" class="accordion-collapse collapse"
             aria-labelledby="headingEvaluated" data-bs-parent="#datosAccordion">
          <div class="accordion-body d-flex flex-wrap">

            <!-- Gráfico evaluado con tamaño ajustado -->
            <div class="graph-container">
              {{ evaluated_plot | safe }}
            </div>

            <!-- Checkboxes de laboratorios evaluados -->
            <div class="lab-checklist">
              <h5>Laboratorios</h5>
              {% for lib in evaluated_library %}
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="selected_evaluated" id="eval_{{ forloop.counter0 }}" value="{{ forloop.counter0 }}">
                  <label class="form-check-label" for="eval_{{ forloop.counter0 }}">
                    {{ lib }}
                  </label>
                </div>
              {% endfor %}
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Botón para enviar el formulario y calcular -->
    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Seleccionar datos y calcular</button>
    </div>
  </form>
</div>

<!-- Scripts de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
